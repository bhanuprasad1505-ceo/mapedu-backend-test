spring:
  application:
    name: mapedu-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/mapedu?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    time-zone: Asia/Kolkata

server:
  port: ${PORT:8080}

app:
  security:
    jwt-secret: ${JWT_SECRET:CHANGE_ME_IN_ENVIRONMENT}
    jwt-expiration-ms: ${JWT_EXPIRATION_MS:86400000}
